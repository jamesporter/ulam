<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ulam-prng: seeded random number generation for generative art. A PCG generator with distributions, vectors, Poisson disk points, noise and random walks." />
    <title>ulam-prng — seeded randomness for generative art</title>
    <script>
      // Pick the theme before first paint so there is no flash
      try {
        const stored = localStorage.getItem('theme')
        const dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
